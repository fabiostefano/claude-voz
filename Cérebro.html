<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FRIDAY · Cérebro Vivo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#070910;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  canvas{display:block;touch-action:none}

  #header{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 16px 10px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(7,9,16,.95) 40%,rgba(7,9,16,0));
    display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  #header h1{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#E8EEF5}
  #header p{font-size:10px;color:#5C6478;margin-top:2px}
  #status{font-size:9.5px;color:#4FB08A;text-align:right;max-width:135px;line-height:1.4}
  #gear{background:none;border:none;color:#5C6478;font-size:17px;padding:0 0 0 10px;pointer-events:auto}

  #orb{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:26;
    width:74px;height:74px;border-radius:50%;border:none;
    background:radial-gradient(circle at 35% 30%,#7FE3DF,#3D9AA8);
    box-shadow:0 8px 30px rgba(95,212,208,.3);
    display:flex;align-items:center;justify-content:center;font-size:27px;color:#04252B;transition:transform .15s}
  #orb:active{transform:translateX(-50%) scale(.93)}
  #orb.listening{animation:pulse 1.4s infinite;background:radial-gradient(circle at 35% 30%,#FFB86B,#E07A5F)}
  #orb.thinking{animation:breathe 1.3s ease-in-out infinite;background:radial-gradient(circle at 35% 30%,#C3AEF5,#7B5FD4)}
  #orb.speaking{animation:breathe .9s ease-in-out infinite;background:radial-gradient(circle at 35% 30%,#9FF0EC,#4FB08A)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,122,95,.55)}70%{box-shadow:0 0 0 26px rgba(224,122,95,0)}100%{box-shadow:0 0 0 0 rgba(224,122,95,0)}}
  @keyframes breathe{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

  .side{position:fixed;bottom:calc(36px + env(safe-area-inset-bottom));z-index:26}
  .side.left{left:20px}.side.right{right:20px}
  .mini{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.1);
    background:rgba(20,24,36,.9);color:#A6ADBD;font-size:19px}

  #caption{position:fixed;bottom:calc(112px + env(safe-area-inset-bottom));left:16px;right:16px;z-index:24;
    text-align:center;font-size:13px;color:#8890A3;min-height:20px;pointer-events:none;transition:opacity .3s;line-height:1.45}
  #caption b{color:#5FD4D0;font-weight:500}

  .panel{position:fixed;inset:0;z-index:40;background:rgba(7,9,16,.97);display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,.35,1)}
  .panel.open{transform:translateY(0)}
  .phead{padding:15px 18px;padding-top:calc(15px + env(safe-area-inset-top));display:flex;justify-content:space-between;
    align-items:center;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
  .phead h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#E8EEF5;font-weight:500}
  .phead button{background:none;border:none;color:#8890A3;font-size:20px;padding:4px 8px}

  #msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:#1E2A3D;color:#DCE4F0;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:#141824;color:#C4CBDA;border-bottom-left-radius:4px;border:1px solid rgba(95,212,208,.12)}
  .msg.sys{align-self:center;color:#4FB08A;font-size:11px;text-align:center}
  .msg.err{align-self:center;background:rgba(220,80,80,.1);color:#E09090;font-size:12px}
  #inputRow{display:flex;gap:8px;padding:11px 13px calc(13px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
  #inputRow textarea{flex:1;background:#12151F;border:1px solid rgba(255,255,255,.1);border-radius:14px;
    color:#E8EEF5;font-size:16px;padding:11px 14px;resize:none;max-height:110px;outline:none;font-family:inherit}
  #sendBtn{width:46px;height:46px;align-self:flex-end;border-radius:50%;background:#5FD4D0;border:none;color:#070910;font-size:18px;font-weight:700}
  #sendBtn:disabled{opacity:.4}
  .typing{display:inline-flex;gap:4px}
  .typing span{width:6px;height:6px;border-radius:50%;background:#5FD4D0;animation:tp 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}

  #setBody{flex:1;overflow-y:auto;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}
  .fld{margin-bottom:18px}
  .fld label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5FD4D0;margin-bottom:6px}
  .fld input{width:100%;background:#12151F;border:1px solid rgba(255,255,255,.1);border-radius:11px;
    color:#E8EEF5;font-size:16px;padding:11px 13px;outline:none;font-family:inherit}
  .fld small{display:block;color:#5C6478;font-size:11px;margin-top:6px;line-height:1.45}
  .toggleRow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .toggleRow span{font-size:13.5px;color:#C4CBDA}
  .sw{width:44px;height:25px;border-radius:14px;background:#252A3A;border:none;position:relative;transition:background .2s;flex-shrink:0}
  .sw.on{background:#4FB08A}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on::after{transform:translateX(19px)}
  .bigBtn{width:100%;padding:14px;border-radius:13px;background:#5FD4D0;color:#070910;border:none;font-size:14px;font-weight:600;margin-top:14px}
  .bigBtn.ghost{background:rgba(255,255,255,.06);color:#A6ADBD}
  .bigBtn.danger{background:rgba(220,80,80,.15);color:#E09090;margin-top:10px}
  #diagBox{margin-top:22px;padding:13px;background:#0D1018;border:1px solid rgba(255,255,255,.07);border-radius:11px;
    font-size:11px;color:#7A8296;line-height:1.7;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}

  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#10131F;border-top:1px solid rgba(255,255,255,.08);
    border-radius:20px 20px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(115%);
    transition:transform .32s cubic-bezier(.32,.72,.35,1);max-height:52vh;overflow-y:auto}
  #sheet.open{transform:translateY(0)}
  #sheet .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px}
  #sheet h2{font-size:18px;color:#F0F3F8;margin-bottom:6px;font-weight:500}
  #sheet p{font-size:13px;line-height:1.55;color:#A6ADBD}
  #sheet .close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:#8890A3;font-size:15px}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="header">
  <div><h1>FRIDAY · Cérebro</h1><p>toque no orbe e fale</p></div>
  <div style="display:flex;align-items:flex-start">
    <div id="status">iniciando…</div>
    <button id="gear">⚙</button>
  </div>
</div>

<div id="caption"></div>

<button id="orb">🎙</button>
<div class="side left"><button class="mini" id="btnChat">💬</button></div>
<div class="side right"><button class="mini" id="btnGmail">📧</button></div>

<div id="sheet">
  <button class="close" id="btnCloseSheet">✕</button>
  <div class="tag" id="shTag"></div>
  <h2 id="shTitle"></h2>
  <p id="shDetail"></p>
</div>

<div class="panel" id="chat">
  <div class="phead"><h2>Conversa</h2><button data-close="chat">✕</button></div>
  <div id="msgs"></div>
  <div id="inputRow">
    <textarea id="inp" rows="1" placeholder="Escreve ou usa o orbe pra falar…"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<div class="panel" id="settings">
  <div class="phead"><h2>Configuração</h2><button data-close="settings">✕</button></div>
  <div id="setBody">
    <div class="fld">
      <label>URL do servidor FRIDAY</label>
      <input id="cfgFriday" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      <small>Web app friday-servidor, publicado para "Qualquer pessoa". Obrigatório nesta versão.</small>
    </div>
    <div class="fld">
      <label>URL do LimpezaGmail</label>
      <input id="cfgGmail" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
      <small>Endpoint doGet do LimpezaGmail v4.1.</small>
    </div>
    <div class="toggleRow"><span>Falar as respostas</span><button class="sw on" id="swSpeak"></button></div>
    <div class="toggleRow"><span>Escuta contínua</span><button class="sw" id="swCont"></button></div>
    <div class="toggleRow" style="border:none"><span>Criar nós automaticamente</span><button class="sw on" id="swAuto"></button></div>
    <button class="bigBtn" id="btnSaveCfg">Salvar configuração</button>
    <button class="bigBtn ghost" id="btnTestMic">Testar microfone</button>
    <button class="bigBtn ghost" id="btnTestFriday">Testar servidor FRIDAY</button>
    <button class="bigBtn danger" id="btnReset">Zerar o cérebro</button>
    <div id="diagBox">diagnóstico…</div>
  </div>
</div>

<script>
'use strict';

/* ─────────── DIAGNÓSTICO NA TELA ─────────── */
var logLines = [];
function log(s){
  logLines.push(new Date().toLocaleTimeString('pt-BR').slice(0,8)+'  '+s);
  if(logLines.length>60) logLines.shift();
  var b=document.getElementById('diagBox');
  if(b){ b.textContent=logLines.join('\n'); b.scrollTop=b.scrollHeight; }
}
window.onerror=function(m,src,ln){ log('✖ '+m+' @'+ln); return false; };
window.addEventListener('unhandledrejection',function(e){ log('✖ promise: '+(e.reason&&e.reason.message||e.reason)); });

/* ─────────── ESTADO ─────────── */
var cfg={friday:'',gmail:'',speak:true,cont:false,auto:true};
var graph=null, chatHistory=[], busy=false, listening=false, speaking=false;

var CLUSTERS={
  core:{main:'#5FD4D0',glow:'rgba(95,212,208,',label:'Núcleo'},
  vale:{main:'#5B8FB0',glow:'rgba(91,143,176,',label:'Vale · Porto São Luís'},
  calango:{main:'#D0A93B',glow:'rgba(208,169,59,',label:'Livro Calango'},
  dev:{main:'#9B84DD',glow:'rgba(155,132,221,',label:'Dev & Apps'},
  tri:{main:'#4FB08A',glow:'rgba(79,176,138,',label:'Triatleta'},
  gmail:{main:'#E0655F',glow:'rgba(224,101,95,',label:'Gmail'},
  novo:{main:'#E07A5F',glow:'rgba(224,122,95,',label:'Novo tema'}
};

var SEED={
  nodes:[
    {id:'core',label:'Fábio',cluster:'core',hub:true,detail:'Engenheiro eletricista na Vale e atleta Master de triatlo. Centro da rede.'},
    {id:'vale',label:'Vale · Porto São Luís',cluster:'vale',hub:true,detail:'Implantação de projetos elétricos: EFC Carajás, inspeções, P&ID, PLC/SCADA, NRs.'},
    {id:'eteq',label:'Auditoria ETEQ CACP',cluster:'vale',detail:'9 não conformidades críticas (16/06/2026), NR-10 com interdição, cronograma de 180 a 300 dias úteis.'},
    {id:'eteop',label:'ETE CAOP PLC/SCADA',cluster:'vale',detail:'Spec Studio 5000, UDT T_MOTOR, rotinas Structured Text, sinótico SCADA em React.'},
    {id:'gantry',label:'Pórtico Móvel',cluster:'vale',detail:'Kaizen de proteção contra queda nos tetos dos trens EFC. Pendências: gabarito do carro, pé-direito da oficina, demarcação do piso, ART.'},
    {id:'calango',label:'Livro Calango',cluster:'calango',hub:true,detail:'Resistente como um Calango (Viegas Editora) — para os que não são o atleta padrão.'},
    {id:'capa',label:'Capa finalizada',cluster:'calango',detail:'Arte fechada em 26/05/2026.'},
    {id:'noite',label:'Noite de Autógrafos',cluster:'calango',detail:'Evento de lançamento com sessão de autógrafos.'},
    {id:'dev',label:'Dev & Apps',cluster:'dev',hub:true,detail:'Automação e desenvolvimento — tudo do celular Android, sem PC.'},
    {id:'friday',label:'FRIDAY',cluster:'dev',detail:'Assistente de voz: GitHub Pages + Apps Script v4. Agora é a voz deste cérebro.'},
    {id:'limpeza',label:'LimpezaGmail v4.1',cluster:'gmail',detail:'Promocionais não lidos com mais de 30 dias, com remetentes protegidos.'},
    {id:'iad',label:'IA do Dia',cluster:'dev',detail:'Rotina das 7h: 1 ferramenta + 1 conceito. Atalho iad.'},
    {id:'copa',label:'Copa 26 App',cluster:'dev',detail:'App GAS da Copa 2026, chamadas de API sempre no servidor.'},
    {id:'tri',label:'Triatleta',cluster:'tri',hub:true,detail:'9 anos de competição, categoria Master, Ironman 70.3 e Mundiais Age Group.'}
  ],
  edges:[['core','vale'],['core','calango'],['core','dev'],['core','tri'],
    ['vale','eteq'],['vale','eteop'],['vale','gantry'],['calango','capa'],['calango','noite'],
    ['dev','friday'],['dev','limpeza'],['dev','iad'],['dev','copa'],['friday','limpeza'],['tri','calango']]
};

function $(id){ return document.getElementById(id); }
var statusEl,cap,orb,msgs,inp,sendBtn;

/* ─────────── ARMAZENAMENTO (localStorage) ─────────── */
var mem={}, lsOK=false;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); lsOK=true; }catch(e){ log('localStorage bloqueado, usando memória'); }
function stGet(k){ return lsOK ? localStorage.getItem(k) : (mem[k]||null); }
function stSet(k,v){ mem[k]=v; if(lsOK){ try{ localStorage.setItem(k,v); }catch(e){ log('falha ao gravar '+k); } } }

function loadState(){
  try{ var c=JSON.parse(stGet('fr-cfg')||'{}'); for(var k in c) cfg[k]=c[k]; }catch(e){}
  try{ graph=JSON.parse(stGet('fr-graph')||'null'); }catch(e){ graph=null; }
  if(!graph||!graph.nodes||!graph.nodes.length) graph=JSON.parse(JSON.stringify(SEED));
  try{ chatHistory=JSON.parse(stGet('fr-chat')||'[]')||[]; }catch(e){ chatHistory=[]; }
  $('cfgFriday').value=cfg.friday||''; $('cfgGmail').value=cfg.gmail||'';
  setSw('swSpeak',cfg.speak); setSw('swCont',cfg.cont); setSw('swAuto',cfg.auto);
}
function save(){
  stSet('fr-graph',JSON.stringify(graph));
  stSet('fr-chat',JSON.stringify(chatHistory.slice(-40)));
  stSet('fr-cfg',JSON.stringify(cfg));
  upStatus();
}
function upStatus(){ statusEl.textContent=graph.nodes.length+' nós · '+graph.edges.length+' sinapses'+(cfg.friday?' · FRIDAY':''); }
function setSw(id,v){ $(id).classList.toggle('on',!!v); }

/* ─────────── CANVAS ─────────── */
var canvas,ctx,W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
var sim={nodes:[],edges:[],byId:{}},particles=[],selected=null,dragN=null,moved=false,energy=0;

function rebuild(){
  var old={}; sim.nodes.forEach(function(n){old[n.id]=n;});
  sim.nodes=graph.nodes.map(function(n){
    var o=old[n.id];
    return {id:n.id,label:n.label,cluster:n.cluster,hub:!!n.hub,detail:n.detail,
      x:o?o.x:W/2+(Math.random()-.5)*140,y:o?o.y:H/2+(Math.random()-.5)*140,
      vx:o?o.vx:0,vy:o?o.vy:0,r:n.id==='core'?26:(n.hub?18:11),born:o?o.born:performance.now()};
  });
  sim.byId={}; sim.nodes.forEach(function(n){sim.byId[n.id]=n;});
  sim.edges=graph.edges.filter(function(e){return sim.byId[e[0]]&&sim.byId[e[1]];});
  particles.length=0;
  sim.edges.forEach(function(e){for(var k=0;k<2;k++)particles.push({from:e[0],to:e[1],t:Math.random(),speed:.002+Math.random()*.002});});
  upStatus();
}
function physics(){
  var N=sim.nodes,i,j;
  for(i=0;i<N.length;i++)for(j=i+1;j<N.length;j++){
    var a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy; if(d2<1)d2=1;
    var d=Math.sqrt(d2),f=2700/d2,fx=dx/d*f,fy=dy/d*f;
    if(a!==dragN){a.vx-=fx;a.vy-=fy} if(b!==dragN){b.vx+=fx;b.vy+=fy}
  }
  sim.edges.forEach(function(e){
    var a=sim.byId[e[0]],b=sim.byId[e[1]];
    var rest=(a.hub&&b.hub)?Math.min(W,H)*.32:Math.min(W,H)*.16;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.max(Math.sqrt(dx*dx+dy*dy),.01),f=(d-rest)*.012;
    var fx=dx/d*f,fy=dy/d*f;
    if(a!==dragN){a.vx+=fx;a.vy+=fy} if(b!==dragN){b.vx-=fx;b.vy-=fy}
  });
  N.forEach(function(n){
    if(n===dragN)return;
    n.vx+=(W/2-n.x)*.0012; n.vy+=(H/2-n.y)*.0012;
    n.vx*=.90;n.vy*=.90;n.x+=n.vx;n.y+=n.vy;
    var m=n.r+8;
    if(n.x<m){n.x=m;n.vx*=-.5} if(n.x>W-m){n.x=W-m;n.vx*=-.5}
    if(n.y<m+58){n.y=m+58;n.vy*=-.5} if(n.y>H-m-115){n.y=H-m-115;n.vy*=-.5}
  });
}
function draw(now){
  try{
    physics(); ctx.clearRect(0,0,W,H);
    var boost=1+energy*2.2;
    sim.edges.forEach(function(e){
      var A=sim.byId[e[0]],B=sim.byId[e[1]],hl=selected&&(selected===e[0]||selected===e[1]);
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
      ctx.strokeStyle=hl?'rgba(255,255,255,.35)':'rgba(255,255,255,'+(.07+energy*.09).toFixed(3)+')';
      ctx.lineWidth=hl?1.6:1;ctx.stroke();
    });
    particles.forEach(function(p){
      p.t+=p.speed*boost; if(p.t>1)p.t=0;
      var A=sim.byId[p.from],B=sim.byId[p.to]; if(!A||!B)return;
      var x=A.x+(B.x-A.x)*p.t,y=A.y+(B.y-A.y)*p.t;
      var c=CLUSTERS[B.cluster]||CLUSTERS.novo,fade=Math.sin(p.t*Math.PI);
      ctx.beginPath();ctx.arc(x,y,1.5+fade*1.5*boost,0,Math.PI*2);
      ctx.fillStyle=c.main;ctx.globalAlpha=.25+fade*.6;ctx.fill();ctx.globalAlpha=1;
    });
    sim.nodes.forEach(function(n){
      var c=CLUSTERS[n.cluster]||CLUSTERS.novo,isSel=selected===n.id;
      var age=Math.min((now-n.born)/700,1),scale=.4+.6*(1-Math.pow(1-age,3));
      var pulse=n.id==='core'?(Math.sin(now*.0022)*.5+.5)*(4+energy*10):0;
      var R=(n.r+pulse)*scale,gR=R*(isSel?3.2:2.3+energy);
      var g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,gR);
      g.addColorStop(0,c.glow+(isSel?.55:.28+energy*.25).toFixed(3)+')');
      g.addColorStop(1,c.glow+'0)');
      ctx.beginPath();ctx.arc(n.x,n.y,gR,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.beginPath();ctx.arc(n.x,n.y,R,0,Math.PI*2);ctx.fillStyle=c.main;ctx.fill();
      if(n.hub||isSel||n.cluster==='novo'||n.cluster==='gmail'){
        ctx.font=(n.id==='core'?'600 12px':'500 10.5px')+' sans-serif';
        ctx.fillStyle='#E8EEF5';ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+R+14);
      }
    });
    energy*=.94;
  }catch(err){ log('✖ draw: '+err.message); }
  requestAnimationFrame(draw);
}
function ptOf(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

/* ─────────── VOZ ─────────── */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null,ptVoice=null,restartTimer=null;

function loadVoices(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices();
  var found=vs.filter(function(v){return /^pt/i.test(v.lang);})[0];
  if(found&&found!==ptVoice){ ptVoice=found; log('voz pt: '+found.name); }
}
function initRec(){
  if(!SR){ log('✖ SpeechRecognition indisponível neste navegador'); showCap('Sem reconhecimento de voz. Use o Chrome.'); return null; }
  var r=new SR();
  r.lang='pt-BR'; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
  r.onstart=function(){ listening=true; orb.classList.add('listening'); showCap('Ouvindo…'); log('mic ON'); };
  r.onaudiostart=function(){ log('áudio capturando'); };
  r.onresult=function(e){
    var interim='',final='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    if(interim) showCap(esc(interim));
    if(final.trim()){ log('ouvi: '+final.trim()); showCap('<b>'+esc(final.trim())+'</b>'); stopRec(); handleVoice(final.trim()); }
  };
  r.onerror=function(ev){
    log('✖ mic: '+ev.error);
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){
      showCap('Microfone bloqueado. Toque no cadeado 🔒 da barra de endereço e permita o microfone.');
      cfg.cont=false; setSw('swCont',false);
    } else if(ev.error==='network'){
      showCap('Sem rede para o reconhecimento de voz.');
    }
  };
  r.onend=function(){
    listening=false; orb.classList.remove('listening'); log('mic OFF');
    if(cfg.cont&&!busy&&!speaking){ clearTimeout(restartTimer); restartTimer=setTimeout(startRec,500); }
  };
  return r;
}
function startRec(){
  if(listening||busy||speaking)return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){
    showCap('O microfone só funciona em HTTPS.'); log('✖ não é HTTPS'); return;
  }
  if(!rec) rec=initRec();
  if(!rec)return;
  try{ rec.start(); }catch(e){ log('start ignorado: '+e.message); }
}
function stopRec(){ clearTimeout(restartTimer); if(rec&&listening){try{rec.abort()}catch(e){}} listening=false; orb.classList.remove('listening'); }
function toggleVoice(){ listening?stopRec():startRec(); }
function esc(s){ return String(s).replace(/[<>&]/g,function(m){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[m];}); }
function showCap(h){ cap.innerHTML=h; cap.style.opacity=1; clearTimeout(cap._t); cap._t=setTimeout(function(){cap.style.opacity=0;},8000); }
function say(text){
  showCap(esc(text));
  if(!cfg.speak||!window.speechSynthesis){ if(cfg.cont) startRec(); return; }
  stopRec(); speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(String(text).replace(/[*#`_~]/g,''));
  u.lang='pt-BR'; u.rate=1.05; if(ptVoice) u.voice=ptVoice;
  speaking=true; orb.classList.add('speaking');
  var done=function(){ if(!speaking)return; speaking=false; orb.classList.remove('speaking');
    if(cfg.cont) restartTimer=setTimeout(startRec,350); };
  u.onend=done; u.onerror=done;
  setTimeout(function(){ if(speaking&&!speechSynthesis.speaking) done(); },1500);
  try{ speechSynthesis.speak(u); }catch(e){ log('✖ fala: '+e.message); done(); }
}

/* ─────────── GMAIL ─────────── */
function runGmailCleanup(){
  if(!cfg.gmail){ say('Preciso da URL do LimpezaGmail.'); openP('settings'); return Promise.resolve(); }
  openP('chat'); bubble('sys','📧 chamando LimpezaGmail…'); say('Rodando a limpeza do Gmail.'); energy=1.2;
  var url=cfg.gmail+(cfg.gmail.indexOf('?')>-1?'&':'?')+'origem=cerebro&t='+Date.now();
  return fetch(url,{method:'GET',redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      txt=(txt||'').trim();
      var clean=txt.length>500?txt.slice(0,500)+'…':(txt||'Execução concluída.');
      bubble('ai',clean); say('Limpeza concluída.');
      addNode({id:'limp'+Date.now().toString(36),label:'Limpeza '+new Date().toLocaleDateString('pt-BR'),
        cluster:'gmail',detail:clean,connectTo:['limpeza']});
      save();
    })
    .catch(function(e){
      log('✖ gmail: '+e.message);
      bubble('err','Falha no LimpezaGmail: '+e.message+'\nChecar: publicado para "Qualquer pessoa" e URL terminando em /exec.');
      say('Não consegui chamar a limpeza.');
    });
}

/* ─────────── CÉREBRO ─────────── */
function bubble(cls,text){ var d=document.createElement('div'); d.className='msg '+cls; d.textContent=text;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d; }
function renderMsgs(){ msgs.innerHTML=''; chatHistory.forEach(function(m){bubble(m.role==='user'?'user':'ai',m.content);}); msgs.scrollTop=msgs.scrollHeight; }
function handleVoice(t){
  if(/limp\w*\s+(o\s+|meu\s+|meus\s+)?(g-?mail|e-?mails?|caixa|inbox)/i.test(t)){ runGmailCleanup(); return; }
  sendMsg(t);
}
function graphSummary(){ return graph.nodes.map(function(n){return n.id+'|'+n.label+'|'+n.cluster;}).join('\n'); }
function SYSTEM(){
return 'Você é FRIDAY, o cérebro do Fábio Sobral — engenheiro eletricista na Vale (Porto São Luís / EFC Carajás), autor de "Resistente como um Calango", triatleta Master, e dev que constrói apps direto do celular.\n\n'+
'Fábio tem TDAH: ação concreta primeiro, uma coisa de cada vez, direto, sem bajulação. Português brasileiro. As respostas serão FALADAS: frases curtas, sem markdown, no máximo 3 frases.\n\n'+
'Grafo atual (id|label|cluster):\n'+graphSummary()+'\n\n'+
'Clusters válidos: vale, calango, dev, tri, gmail, novo.\n'+
'Ação disponível: "limpar_gmail". Use só se ele pedir claramente.\n\n'+
'Responda APENAS com JSON válido, sem markdown:\n'+
'{"reply":"resposta falada","action":null,"newNodes":[{"id":"slug","label":"Nome","cluster":"dev","detail":"1-2 frases","connectTo":["id-existente"]}],"newEdges":[]}\n\n'+
'Só crie newNodes para temas realmente novos. Ids não podem repetir os existentes.';
}
function safeMessages(){
  var h=chatHistory.slice(-16);
  while(h.length&&h[0].role!=='user') h.shift();
  var out=[];
  h.forEach(function(m){
    if(out.length&&out[out.length-1].role===m.role) out[out.length-1].content+='\n'+m.content;
    else out.push({role:m.role,content:m.content});
  });
  if(!out.length||out[out.length-1].role!=='user') return null;
  return out;
}
function callBrain(body){
  if(!cfg.friday) return Promise.reject(new Error('URL da FRIDAY não configurada'));
  return fetch(cfg.friday,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){ return r.text(); })
    .then(function(t){
      t=(t||'').trim();
      if(!t) throw new Error('servidor retornou vazio');
      if(/^<!DOCTYPE|^<html/i.test(t)) throw new Error('servidor devolveu HTML — verifique se está publicado para "Qualquer pessoa"');
      var j; try{ j=JSON.parse(t); }catch(e){ return {content:[{type:'text',text:t}]}; }
      if(j.error) throw new Error(j.error.message||String(j.error));
      if(j.content) return j;
      return {content:[{type:'text',text:JSON.stringify(j)}]};
    });
}
function extractReply(raw){
  var s=String(raw).replace(/```json/gi,'').replace(/```/g,'').trim();
  try{ return JSON.parse(s); }catch(e){}
  var i=s.indexOf('{'),j=s.lastIndexOf('}');
  if(i>-1&&j>i){ try{ return JSON.parse(s.slice(i,j+1)); }catch(e){} }
  return {reply:s||'Não entendi. Repete?',action:null,newNodes:[],newEdges:[]};
}
function sendMsg(text){
  text=String(text||'').trim();
  if(!text||busy)return;
  inp.value=''; inp.style.height='auto'; openP('chat');
  chatHistory.push({role:'user',content:text}); bubble('user',text);
  busy=true; sendBtn.disabled=true; stopRec(); orb.classList.add('thinking'); energy=1;
  var typing=bubble('ai',''); typing.innerHTML='<span class="typing"><span></span><span></span><span></span></span>';
  var msgList=safeMessages();
  var done=function(){ busy=false; sendBtn.disabled=false; orb.classList.remove('thinking'); };
  if(!msgList){ typing.remove(); bubble('err','Histórico inválido.'); done(); return; }
  callBrain({model:'claude-sonnet-4-6',max_tokens:1000,system:SYSTEM(),messages:msgList})
    .then(function(data){
      var raw=(data.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');
      var p=extractReply(raw);
      typing.remove(); bubble('ai',p.reply);
      chatHistory.push({role:'assistant',content:p.reply});
      var changed=false;
      if(cfg.auto){
        (p.newNodes||[]).forEach(function(n){ if(addNode(n)) changed=true; });
        (p.newEdges||[]).forEach(function(e){
          var a=e[0],b=e[1];
          var ok=graph.nodes.some(function(n){return n.id===a;})&&graph.nodes.some(function(n){return n.id===b;});
          var dup=graph.edges.some(function(x){return (x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a);});
          if(ok&&!dup&&a!==b){ graph.edges.push([a,b]); changed=true; }
        });
      }
      if(changed){ rebuild(); bubble('sys','⚡ novas sinapses'); energy=1.5; }
      save(); done(); say(p.reply);
      if(p.action==='limpar_gmail') runGmailCleanup();
    })
    .catch(function(e){
      log('✖ cérebro: '+e.message);
      typing.remove(); bubble('err','Erro: '+e.message); done(); say('Deu erro na conexão.');
    });
}
function addNode(n){
  if(!n||!n.id)return false;
  var id=String(n.id).trim();
  if(!id||graph.nodes.some(function(x){return x.id===id;}))return false;
  graph.nodes.push({id:id,label:n.label||id,cluster:CLUSTERS[n.cluster]?n.cluster:'novo',detail:n.detail||''});
  var links=(n.connectTo||[]).filter(function(t){return t!==id&&graph.nodes.some(function(x){return x.id===t;});});
  if(links.length) links.forEach(function(t){graph.edges.push([t,id]);});
  else graph.edges.push(['core',id]);
  rebuild(); return true;
}

/* ─────────── PAINÉIS ─────────── */
function openP(id){ $(id).classList.add('open'); if(id==='chat') renderMsgs(); }
function closeP(id){ $(id).classList.remove('open'); }
function openSheet(n){
  selected=n.id; var c=CLUSTERS[n.cluster]||CLUSTERS.novo,t=$('shTag');
  t.textContent=c.label; t.style.background=c.glow+'.18)'; t.style.color=c.main;
  $('shTitle').textContent=n.label; $('shDetail').textContent=n.detail||'';
  $('sheet').classList.add('open');
}
function closeSheet(){ selected=null; $('sheet').classList.remove('open'); }

/* ─────────── BOOT ─────────── */
window.addEventListener('DOMContentLoaded',function(){
  statusEl=$('status'); cap=$('caption'); orb=$('orb'); msgs=$('msgs'); inp=$('inp'); sendBtn=$('sendBtn');
  canvas=$('c'); ctx=canvas.getContext('2d'); resize();
  window.addEventListener('resize',resize);

  canvas.addEventListener('pointerdown',function(e){
    var p=ptOf(e); moved=false; var best=null,bd=1e9;
    sim.nodes.forEach(function(n){var d=Math.sqrt((n.x-p.x)*(n.x-p.x)+(n.y-p.y)*(n.y-p.y)); if(d<n.r+16&&d<bd){bd=d;best=n;}});
    dragN=best; if(dragN){try{canvas.setPointerCapture(e.pointerId)}catch(err){}}
  });
  canvas.addEventListener('pointermove',function(e){
    if(!dragN)return; var p=ptOf(e),dx=p.x-dragN.x,dy=p.y-dragN.y;
    if(Math.sqrt(dx*dx+dy*dy)>4) moved=true;
    dragN.vx=dx*.4; dragN.vy=dy*.4; dragN.x=p.x; dragN.y=p.y;
  });
  window.addEventListener('pointerup',function(){ if(dragN&&!moved) openSheet(dragN); dragN=null; });

  loadState(); rebuild(); requestAnimationFrame(draw);
  if(window.speechSynthesis){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }

  log('protocolo: '+location.protocol+' · '+(SR?'SpeechRecognition OK':'SEM SpeechRecognition'));
  log('em iframe: '+(window.self!==window.top?'SIM (mic bloqueado)':'não'));
  log('armazenamento: '+(lsOK?'localStorage OK':'memória volátil'));

  orb.addEventListener('click',toggleVoice);
  $('gear').addEventListener('click',function(){openP('settings');});
  $('btnChat').addEventListener('click',function(){openP('chat');});
  $('btnGmail').addEventListener('click',runGmailCleanup);
  $('btnCloseSheet').addEventListener('click',closeSheet);
  sendBtn.addEventListener('click',function(){sendMsg(inp.value);});
  inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px';});
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(inp.value);} });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){
    b.addEventListener('click',function(){closeP(b.getAttribute('data-close'));});
  });
  $('swSpeak').addEventListener('click',function(){cfg.speak=!cfg.speak;setSw('swSpeak',cfg.speak);save();});
  $('swCont').addEventListener('click',function(){cfg.cont=!cfg.cont;setSw('swCont',cfg.cont);save();if(!cfg.cont)stopRec();else startRec();});
  $('swAuto').addEventListener('click',function(){cfg.auto=!cfg.auto;setSw('swAuto',cfg.auto);save();});
  $('btnSaveCfg').addEventListener('click',function(){
    cfg.friday=$('cfgFriday').value.trim(); cfg.gmail=$('cfgGmail').value.trim(); save();
    log('config salva'); closeP('settings'); say('Configuração salva.');
  });
  $('btnTestMic').addEventListener('click',function(){
    log('— teste de microfone —');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ log('✖ getUserMedia indisponível'); return; }
    navigator.mediaDevices.getUserMedia({audio:true})
      .then(function(s){ log('✔ permissão concedida'); s.getTracks().forEach(function(t){t.stop();}); startRec(); })
      .catch(function(e){ log('✖ permissão negada: '+e.name); });
  });
  $('btnTestFriday').addEventListener('click',function(){
    var u=$('cfgFriday').value.trim();
    if(!u){ log('✖ URL da FRIDAY vazia'); return; }
    log('— teste FRIDAY —');
    fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:100,messages:[{role:'user',content:'diga ok'}]}),redirect:'follow'})
      .then(function(r){ log('HTTP '+r.status); return r.text(); })
      .then(function(t){ log('resposta: '+t.slice(0,300)); })
      .catch(function(e){ log('✖ '+e.message); });
  });
  $('btnReset').addEventListener('click',function(){
    graph=JSON.parse(JSON.stringify(SEED)); chatHistory=[]; msgs.innerHTML='';
    save(); rebuild(); closeP('settings'); showCap('Cérebro reiniciado.');
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ stopRec(); if(window.speechSynthesis)speechSynthesis.cancel(); speaking=false; orb.classList.remove('speaking'); }
  });
});
</script>
